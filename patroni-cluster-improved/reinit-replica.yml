---
# =============================================================================
# reinit-replica.yml  –  Wipe and reclone a fallen-behind or corrupted replica
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini reinit-replica.yml \
#     -e "target_node=pg-node3"
# =============================================================================

- name: Reinitialise a Patroni replica
  hosts: patroni_cluster
  gather_facts: false

  vars:
    target_node: ""   # required: -e "target_node=pg-nodeX"

  pre_tasks:
    - name: Ensure target_node is specified
      ansible.builtin.assert:
        that: target_node != ""
        fail_msg: "Please specify the node to reinit: -e 'target_node=pg-nodeX'"

  tasks:
    - name: Reinitialise replica {{ target_node }}
      ansible.builtin.command:
        cmd: >-
          patronictl -c {{ patroni_config_dir }}/patroni.yml reinit
          {{ patroni_cluster_name }} {{ target_node }} --force
      become: true
      become_user: postgres
      run_once: true

    - name: Watch until replica is streaming again
      ansible.builtin.uri:
        url: "http://{{ hostvars[target_node].ansible_host }}:{{ patroni_restapi_port }}/replica"
        return_content: false
      register: replica_status
      until: replica_status.status == 200
      retries: 30
      delay: 10
      run_once: true

    - name: Replica is healthy
      ansible.builtin.debug:
        msg: "{{ target_node }} is streaming successfully."
      run_once: true
