---
# =============================================================================
# Role: haproxy  –  Load balancer for the Patroni cluster
# =============================================================================

- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Restart haproxy

- name: Validate HAProxy configuration
  ansible.builtin.command:
    cmd: haproxy -c -f /etc/haproxy/haproxy.cfg
  changed_when: false

- name: Enable and start HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: restarted
    daemon_reload: true

- name: Verify HAProxy is running
  ansible.builtin.command:
    cmd: systemctl is-active haproxy
  register: haproxy_status
  changed_when: false

- name: Assert HAProxy is active
  ansible.builtin.assert:
    that:
      - haproxy_status.stdout == "active"
    fail_msg: "HAProxy failed to start on {{ inventory_hostname }}"
    success_msg: "HAProxy is running on {{ inventory_hostname }}"
