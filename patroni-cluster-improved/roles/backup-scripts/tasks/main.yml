---
# =============================================================================
# Role: backup-scripts
#
# Deploys OR removes the patroni-backup.sh script and cron jobs on all pg-nodes.
# Controlled by the backup_scripts_state variable:
#
#   present → deploy script and cron jobs  (default)
#   absent  → remove script and cron jobs
#
# Run independently:
#   just backup-scripts           # deploy
#   just backup-scripts-remove    # remove
#
#   ansible-playbook site.yml -i inventory/hosts.ini --tags backup-scripts
#   ansible-playbook site.yml -i inventory/hosts.ini --tags backup-scripts -e "backup_scripts_state=absent"
# =============================================================================

# ── Assert valid state ────────────────────────────────────────────────────────
- name: "[backup-scripts] Validate backup_scripts_state value"
  ansible.builtin.assert:
    that:
      - backup_scripts_state in ['present', 'absent']
    fail_msg: "backup_scripts_state must be 'present' or 'absent', got: '{{ backup_scripts_state }}'"
    success_msg: "backup_scripts_state is '{{ backup_scripts_state }}'"

# =============================================================================
# DEPLOY (state = present)
# =============================================================================

# ── Ensure log directory exists ───────────────────────────────────────────────
- name: "[backup-scripts] Ensure pgBackRest log directory exists"
  ansible.builtin.file:
    path: "{{ backup_log_file | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: backup_scripts_state == 'present'

# ── Deploy backup script ──────────────────────────────────────────────────────
- name: "[backup-scripts] Deploy patroni-backup.sh"
  ansible.builtin.template:
    src: patroni-backup.sh.j2
    dest: "{{ backup_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: backup_scripts_state == 'present'

- name: "[backup-scripts] Verify script is executable"
  ansible.builtin.command:
    cmd: "test -x {{ backup_script_path }}"
  changed_when: false
  when: backup_scripts_state == 'present'

# ── Install cron jobs ─────────────────────────────────────────────────────────
- name: "[backup-scripts] Install full backup cron job (Sunday)"
  ansible.builtin.cron:
    name: "pgbackrest full backup"
    user: postgres
    weekday: "{{ backup_full_cron_weekday }}"
    hour: "{{ backup_full_cron_hour }}"
    minute: "{{ backup_full_cron_minute }}"
    job: "{{ backup_script_path }} full >> {{ backup_log_file }} 2>&1"
    state: present
  when: backup_scripts_state == 'present'

- name: "[backup-scripts] Install differential backup cron job (Mon-Sat)"
  ansible.builtin.cron:
    name: "pgbackrest diff backup"
    user: postgres
    weekday: "{{ backup_diff_cron_weekday }}"
    hour: "{{ backup_diff_cron_hour }}"
    minute: "{{ backup_diff_cron_minute }}"
    job: "{{ backup_script_path }} diff >> {{ backup_log_file }} 2>&1"
    state: present
  when: backup_scripts_state == 'present'

# ── Show deployed summary ─────────────────────────────────────────────────────
- name: "[backup-scripts] Show installed cron jobs"
  ansible.builtin.command:
    cmd: crontab -u postgres -l
  register: cron_list
  changed_when: false
  when: backup_scripts_state == 'present'

- name: "[backup-scripts] Deploy summary"
  ansible.builtin.debug:
    msg:
      - "DEPLOYED on {{ inventory_hostname }}"
      - "Script : {{ backup_script_path }}"
      - "Log    : {{ backup_log_file }}"
      - "Full   : every Sunday at {{ backup_full_cron_hour }}:{{ backup_full_cron_minute.zfill(2) }}"
      - "Diff   : Mon-Sat at {{ backup_diff_cron_hour }}:{{ backup_diff_cron_minute.zfill(2) }}"
      - "Manual : sudo -u postgres {{ backup_script_path }} full"
  when: backup_scripts_state == 'present'

# =============================================================================
# REMOVE (state = absent)
# =============================================================================

# ── Remove cron jobs ──────────────────────────────────────────────────────────
- name: "[backup-scripts] Remove full backup cron job"
  ansible.builtin.cron:
    name: "pgbackrest full backup"
    user: postgres
    state: absent
  when: backup_scripts_state == 'absent'

- name: "[backup-scripts] Remove differential backup cron job"
  ansible.builtin.cron:
    name: "pgbackrest diff backup"
    user: postgres
    state: absent
  when: backup_scripts_state == 'absent'

# ── Remove backup script ──────────────────────────────────────────────────────
- name: "[backup-scripts] Remove patroni-backup.sh"
  ansible.builtin.file:
    path: "{{ backup_script_path }}"
    state: absent
  when: backup_scripts_state == 'absent'

# ── Show removal summary ──────────────────────────────────────────────────────
- name: "[backup-scripts] Removal summary"
  ansible.builtin.debug:
    msg:
      - "REMOVED from {{ inventory_hostname }}"
      - "Deleted : {{ backup_script_path }}"
      - "Removed : pgbackrest full backup cron job"
      - "Removed : pgbackrest diff backup cron job"
      - "Note    : pgBackRest itself and its repository are untouched"
      - "Note    : existing backups in /var/lib/pgbackrest are untouched"
  when: backup_scripts_state == 'absent'
