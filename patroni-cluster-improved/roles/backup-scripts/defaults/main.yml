---
# =============================================================================
# roles/backup-scripts/defaults/main.yml
# =============================================================================

# Action — set to 'present' to deploy, 'absent' to remove
# Override from command line:
#   just backup-scripts          → deploy (present)
#   just backup-scripts-remove   → remove (absent)
#   ansible-playbook site.yml --tags backup-scripts -e "backup_scripts_state=absent"
backup_scripts_state: present

# Backup script location
backup_script_path: /usr/local/bin/patroni-backup.sh

# Log file
backup_log_file: /var/log/pgbackrest/backup.log

# Stanza name — must match pgbackrest role
pgbackrest_stanza: "{{ patroni_cluster_name }}"

# Patroni REST API port — must match patroni role
patroni_api_port: "{{ patroni_restapi_port }}"

# Cron schedule
backup_full_cron_hour: "*"
backup_full_cron_minute: "*"
backup_full_cron_weekday: "*"      # Sunday

backup_diff_cron_hour: "*"
backup_diff_cron_minute: "*"
backup_diff_cron_weekday: "*"    # Mon-Sat
