---
# =============================================================================
# Role: patroni  –  Install Patroni and configure the HA cluster
# =============================================================================

# ── Python / Patroni installation ────────────────────────────────────────────
- name: Install Python build dependencies
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-dev
      - python3-venv
      - libpq-dev
    state: present

- name: Create Patroni virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv {{ patroni_venv_path }}
    creates: "{{ patroni_venv_path }}/bin/activate"

- name: Install Patroni with etcd support
  ansible.builtin.pip:
    name:
      - "patroni[etcd]"
      - psycopg2-binary
    virtualenv: "{{ patroni_venv_path }}"
    state: present

- name: Symlink patroni binaries to /usr/local/bin
  ansible.builtin.file:
    src: "{{ patroni_venv_path }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - patroni
    - patronictl

# ── Directories ───────────────────────────────────────────────────────────────
- name: Create Patroni directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  loop:
    - "{{ patroni_config_dir }}"
    - "{{ patroni_home_dir }}"
    - "{{ patroni_log_dir }}"

# ── Stop Patroni and wipe data dir before reconfiguring ──────────────────────
# This prevents replicas from trying to re-join with stale replication state
# from a previous failed run, which causes them to stay uninitialized forever.
- name: Stop Patroni before reconfiguring
  ansible.builtin.systemd:
    name: patroni
    state: stopped
  ignore_errors: true

- name: Remove stale Patroni data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: absent

- name: Recreate clean Patroni data directory
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

# ── Configuration ─────────────────────────────────────────────────────────────
- name: Deploy patroni.yml
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ patroni_config_dir }}/patroni.yml"
    owner: postgres
    group: postgres
    mode: "0600"

# ── Systemd service ───────────────────────────────────────────────────────────
- name: Deploy Patroni systemd unit
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start Patroni
  ansible.builtin.systemd:
    name: patroni
    enabled: true
    state: restarted
    daemon_reload: true

# ── Cluster health check ──────────────────────────────────────────────────────
# delegate_to runs this HTTP check FROM the pg-node itself, not from your
# WSL laptop. Without this, the uri module tries to reach a GCP internal IP
# (10.x.x.x) from your laptop — which has no route to it and times out.
- name: Wait for Patroni REST API to become available
  ansible.builtin.uri:
    url: "http://{{ internal_ip }}:{{ patroni_restapi_port }}/health"
    return_content: false
  register: patroni_health
  until: patroni_health.status == 200
  retries: 30
  delay: 10
  become: false
  delegate_to: "{{ inventory_hostname }}"

- name: Show Patroni node status
  ansible.builtin.debug:
    msg: "Patroni on {{ inventory_hostname }} is UP — role: {{ patroni_health.json.role | default('unknown') }}"
