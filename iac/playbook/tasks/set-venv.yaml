- name: Update apt cache
  apt:
    update_cache: yes

- name: Install pip and venv
  apt:
    name:
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - git
      - curl
    state: present

- name: Create GCP venv and install google-auth and requests
  pip:
    name:
      - requests
      - google-auth
    virtualenv: /opt/gcp-venv
    virtualenv_command: python3 -m venv

# -------------------------------------------------------
# Install Ansible collections for GCP modules
# -------------------------------------------------------
- name: Install google.cloud ansible collection
  ansible.builtin.command:
    cmd: ansible-galaxy collection install google.cloud -p /home/seang/.ansible/collections --force
  become: false
  changed_when: true

# -------------------------------------------------------
# Setup Kubespray virtualenv with correct ansible version
# -------------------------------------------------------
- name: Create kubespray virtualenv
  ansible.builtin.command:
    cmd: python3 -m venv /home/seang/kubespray-venv
    creates: /home/seang/kubespray-venv/bin/activate

- name: Upgrade pip in kubespray venv
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: /home/seang/kubespray-venv

- name: Install kubespray requirements into venv
  ansible.builtin.pip:
    requirements: /home/seang/final-project/iac/kubespray/requirements.txt
    virtualenv: /home/seang/kubespray-venv

- name: Verify ansible version in kubespray venv
  ansible.builtin.command:
    cmd: /home/seang/kubespray-venv/bin/ansible --version
  register: kubespray_ansible_ver
  changed_when: false
  become: false

- name: Show kubespray ansible version
  debug:
    msg: "Kubespray ansible: {{ kubespray_ansible_ver.stdout_lines[0] }}"

# -------------------------------------------------------
# Verify GCP tools are ready
# -------------------------------------------------------
- name: Verify gcloud is available
  ansible.builtin.command:
    cmd: gcloud --version
  register: gcloud_ver
  changed_when: false
  become: false
  failed_when: false

- name: Show gcloud version
  debug:
    msg: "{{ gcloud_ver.stdout_lines[0] }}"
  when: gcloud_ver.rc == 0

- name: Warn if gcloud not found
  debug:
    msg: "WARNING: gcloud not found — install Google Cloud SDK manually"
  when: gcloud_ver.rc != 0

- name: Verify GCP authentication
  ansible.builtin.command:
    cmd: gcloud auth application-default print-access-token
  register: gcp_auth_check
  changed_when: false
  become: false
  failed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "/home/seang/.config/gcloud/application_default_credentials.json"

- name: Show GCP auth status
  debug:
    msg: "GCP auth: OK ✅"
  when: gcp_auth_check.rc == 0

- name: Warn if GCP not authenticated
  debug:
    msg: "WARNING: GCP not authenticated — run: gcloud auth application-default login"
  when: gcp_auth_check.rc != 0
# ```

# ---

# ## What Was Added
# ```
# BEFORE                              AFTER
# ──────────────────────────────────────────────────────────
# apt install pip + venv only    →   + python3-dev, build-essential
#                                     git, curl (needed for kubespray)

# GCP venv only                  →   + google.cloud ansible collection
#                                     installed to correct path

# No kubespray venv              →   Create /home/seang/kubespray-venv
#                                     pip install requirements.txt
#                                     → gets ansible 2.17.x for kubespray

# No verification                →   Verify gcloud available
#                                     Verify GCP authenticated
#                                     Show ansible version in kubespray venv
# ```

# ---

# ## Flow
# ```
# set-venv.yaml runs FIRST (become: true)
#         │
#         ├── apt install system deps
#         ├── create /opt/gcp-venv       ← for google.cloud ansible modules
#         ├── install google.cloud collection
#         ├── create /home/seang/kubespray-venv  ← for kubespray ansible
#         ├── pip install kubespray/requirements.txt
#         ├── verify gcloud
#         └── verify GCP auth
#         │
#         ▼
# create-masters-task.yaml       ← uses /opt/gcp-venv
#         │
#         ▼
# main-iac.yaml kubespray play   ← uses /home/seang/kubespray-venv