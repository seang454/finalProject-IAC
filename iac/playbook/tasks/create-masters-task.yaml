- name: Refresh inventory to pick up new hosts
  meta: refresh_inventory

# ```

# ---

# ## Key Fix Summary
# ```
# BEFORE (retry in same region):        AFTER (skip entire exhausted region):
# ──────────────────────────────────────────────────────────────────────────
# asia-northeast3-a EXHAUSTED      asia-northeast3-a EXHAUSTED
#   → try asia-northeast3-b ❌       → reject ALL asia-northeast3-* zones
#   → also EXHAUSTED ❌              → pick first zone from different region
#   → playbook FAILS                 → e.g. asia-east1-a ✅

# Change in 1f remap:
#   BEFORE: select('match', region)   → stays in same region
#   AFTER:  reject('match', region)   → skips entire exhausted region

# Change in STAGE 2 retry:
#   BEFORE: reject('equalto', zone)   → avoids only one zone
#   AFTER:  reject('match', region)   → avoids entire region