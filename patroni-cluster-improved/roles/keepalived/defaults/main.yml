---
# =============================================================================
# roles/keepalived/defaults/main.yml
# =============================================================================

# Virtual IP that floats between ha-proxy nodes
# Apps always connect to this IP — never to individual ha-proxy IPs
keepalived_vip: "192.168.1.200"

# Network interface on the ha-proxy nodes (check with: ip a)
keepalived_interface: "eth0"

# Health check timing
keepalived_check_interval: 2
keepalived_check_rise: 2      # successful checks before declaring UP
keepalived_check_fall: 3      # failed checks before declaring DOWN

# Priority — higher number wins MASTER election
# ha-proxy1 is preferred MASTER when all nodes are healthy
keepalived_priorities:
  ha-proxy1: 101
  ha-proxy2: 100
  ha-proxy3: 99

# Virtual router ID — must be unique per VIP on the network (1-255)
keepalived_router_id: 51

# Auth password shared between keepalived peers (max 8 chars)
keepalived_auth_pass: "hapass01"
