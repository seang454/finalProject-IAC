---
# =============================================================================
# site.yml  –  Configure the Patroni HA cluster
# Run AFTER provision.yml (which creates the GCP VMs)
# =============================================================================

# ── 0. Preflight — verify all nodes are reachable ────────────────────────────
- name: Preflight connectivity check
  hosts: patroni_cluster:etcd_cluster:haproxy:keepalived
  gather_facts: false
  become: false
  tags: [always]

  tasks:
    - name: Wait for SSH to be available on all nodes
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 60
        state: started
      delegate_to: localhost

    - name: Ping all nodes to verify Ansible can connect
      ansible.builtin.ping:

    - name: Verify passwordless sudo works
      ansible.builtin.command: sudo -n true
      changed_when: false
      become: false

    - name: Verify correct user is connecting
      ansible.builtin.debug:
        msg: "Connected to {{ inventory_hostname }} ({{ ansible_host }}) as {{ ansible_user }}"

# ── 1. Configure /etc/hosts on every node ────────────────────────────────────
- name: Configure hostnames on all nodes
  hosts: patroni_cluster:etcd_cluster:haproxy:keepalived
  gather_facts: true
  become: true
  tags: [common, hosts]

  tasks:
    - name: Add pg-node entries to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item.value }} {{ item.key }}"
        regexp: "^.*\\s{{ item.key }}$"
        state: present
      loop: "{{ patroni_nodes | dict2items }}"
      loop_control:
        label: "{{ item.key }} → {{ item.value }}"

    - name: Add ha-proxy entries to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item.value }} {{ item.key }}"
        regexp: "^.*\\s{{ item.key }}$"
        state: present
      loop: "{{ haproxy_nodes | dict2items }}"
      loop_control:
        label: "{{ item.key }} → {{ item.value }}"

# ── 2. Install and configure etcd on all cluster nodes ───────────────────────
# The etcd role wipes stale data dirs and asserts cluster health before
# returning — if this play succeeds, all 3 etcd members are confirmed up.
- name: Setup etcd cluster
  hosts: etcd_cluster
  gather_facts: true
  become: true
  tags: [etcd]

  roles:
    - role: etcd

# ── 3. Install PostgreSQL on all cluster nodes ───────────────────────────────
- name: Install PostgreSQL
  hosts: patroni_cluster
  gather_facts: true
  become: true
  tags: [postgresql]

  roles:
    - role: postgresql

# ── 4. Bootstrap Patroni leader (first node only) ────────────────────────────
- name: Bootstrap Patroni leader
  hosts: "{{ groups['patroni_cluster'][0] }}"
  gather_facts: true
  become: true
  tags: [patroni, patroni-leader]

  roles:
    - role: patroni

# ── 5. Wait for leader to be fully ready before joining replicas ──────────────
# Checks /leader (200 = this node IS the leader, ready to accept replicas).
# Uses delegate_to so the HTTP check runs on the node, not your laptop.
- name: Wait for Patroni leader to be ready
  hosts: "{{ groups['patroni_cluster'][0] }}"
  gather_facts: false
  become: false
  tags: [patroni, patroni-leader]

  tasks:
    - name: Wait until leader REST API responds with 200
      ansible.builtin.uri:
        url: "http://{{ internal_ip }}:{{ patroni_restapi_port }}/leader"
        return_content: false
      register: leader_check
      until: leader_check.status == 200
      retries: 30
      delay: 10
      delegate_to: "{{ inventory_hostname }}"

    - name: Confirm leader is healthy
      ansible.builtin.debug:
        msg: "{{ groups['patroni_cluster'][0] }} is the Patroni leader and ready for replicas"

# ── 6. Join remaining nodes as replicas (one at a time) ───────────────────────
# serial: 1 ensures each replica finishes and passes its health check
# before the next one starts — prevents split-brain during bootstrap.
- name: Join remaining nodes as replicas
  hosts: "{{ groups['patroni_cluster'][1:] }}"
  gather_facts: true
  become: true
  serial: 1
  tags: [patroni, patroni-replicas]

  roles:
    - role: patroni

# ── 7. Verify full Patroni cluster before setting up load balancers ───────────
- name: Verify Patroni cluster is complete
  hosts: "{{ groups['patroni_cluster'][0] }}"
  gather_facts: false
  become: false
  tags: [patroni, verify-cluster]

  tasks:
    - name: Check full cluster status
      ansible.builtin.uri:
        url: "http://{{ internal_ip }}:{{ patroni_restapi_port }}/cluster"
        return_content: true
      register: cluster_status
      delegate_to: "{{ inventory_hostname }}"

    - name: Print cluster members
      ansible.builtin.debug:
        msg: "{{ cluster_status.json | to_nice_json }}"

    - name: Assert all members are present
      ansible.builtin.assert:
        that:
          - cluster_status.json.members | length == patroni_nodes | length
        fail_msg: >-
          Expected {{ patroni_nodes | length }} members but found
          {{ cluster_status.json.members | length }} — fix cluster before continuing
        success_msg: "All {{ patroni_nodes | length }} Patroni members are present"

- name: Setup pgBackRest backup
  hosts: patroni_cluster
  gather_facts: true
  become: true
  tags: [pgbackrest, backup]

  roles:
    - role: pgbackrest

# Requires pgBackRest to be installed first (just backup-setup)
- name: Deploy backup scripts and cron jobs
  hosts: patroni_cluster
  gather_facts: true
  become: true
  tags: [backup-scripts, never]

  roles:
    - role: backup-scripts

# ── 8. Setup HAProxy on dedicated ha-proxy nodes ──────────────────────────────
- name: Setup HAProxy load balancer
  hosts: haproxy
  gather_facts: true
  become: true
  tags: [haproxy]

  roles:
    - role: haproxy

# ── 9. Setup Keepalived on ha-proxy nodes for VIP failover ───────────────────
- name: Setup Keepalived for HAProxy VIP failover
  hosts: haproxy
  gather_facts: true
  become: true
  tags: [keepalived]

  roles:
    - role: keepalived

# ── 10. Final cluster verification ────────────────────────────────────────────
- name: Final cluster health verification
  hosts: "{{ groups['patroni_cluster'][0] }}"
  gather_facts: false
  tags: [verify]

  tasks:
    - name: Check Patroni cluster status via REST API
      ansible.builtin.uri:
        url: "http://{{ internal_ip }}:{{ patroni_restapi_port }}/cluster"
        return_content: true
      register: cluster_status
      become: false
      delegate_to: "{{ inventory_hostname }}"

    - name: Print cluster status
      ansible.builtin.debug:
        msg: "{{ cluster_status.json | to_nice_json }}"

    - name: Assert all members are healthy
      ansible.builtin.assert:
        that:
          - cluster_status.json.members | length == patroni_nodes | length
        fail_msg: >-
          Expected {{ patroni_nodes | length }} members, found
          {{ cluster_status.json.members | length }}
        success_msg: "All {{ patroni_nodes | length }} cluster members are present"

    - name: Verify VIP is reachable
      ansible.builtin.command:
        cmd: "ping -c 1 -W 2 {{ keepalived_vip }}"
      register: vip_check
      changed_when: false
      delegate_to: localhost
      failed_when: false

    - name: Show VIP status
      ansible.builtin.debug:
        msg: >-
          VIP {{ keepalived_vip }}:
          {% if vip_check.rc == 0 %}UP{% else %}UNREACHABLE (expected if running from outside GCP){% endif %}
