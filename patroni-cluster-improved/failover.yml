---
# =============================================================================
# failover.yml  –  Manual switchover / failover operations
#
# Usage:
#   # Graceful switchover to a specific candidate
#   ansible-playbook -i inventory/hosts.ini failover.yml \
#     -e "failover_candidate=pg-node2"
#
#   # Forced failover (use when leader is unreachable)
#   ansible-playbook -i inventory/hosts.ini failover.yml \
#     -e "force_failover=true"
# =============================================================================

- name: Patroni manual switchover / failover
  hosts: patroni_cluster
  gather_facts: false

  vars:
    failover_candidate: ""   # override with -e "failover_candidate=pg-nodeX"
    force_failover: false    # override with -e "force_failover=true"

  tasks:
    - name: Show current cluster status
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ patroni_restapi_port }}/cluster"
        return_content: true
      register: cluster_info
      run_once: true
      delegate_to: "{{ groups['patroni_cluster'][0] }}"

    - name: Print current leader
      ansible.builtin.debug:
        msg: >-
          Current leader:
          {{ cluster_info.json.members | selectattr('role','equalto','leader')
             | map(attribute='name') | first }}
      run_once: true

    - name: Perform graceful switchover
      ansible.builtin.command:
        cmd: >-
          patronictl -c {{ patroni_config_dir }}/patroni.yml switchover
          {{ patroni_cluster_name }}
          {% if failover_candidate %}--candidate {{ failover_candidate }}{% endif %}
          --force
      when: not force_failover | bool
      run_once: true
      become: true
      become_user: postgres

    - name: Perform forced failover
      ansible.builtin.command:
        cmd: >-
          patronictl -c {{ patroni_config_dir }}/patroni.yml failover
          {{ patroni_cluster_name }}
          {% if failover_candidate %}--candidate {{ failover_candidate }}{% endif %}
          --force
      when: force_failover | bool
      run_once: true
      become: true
      become_user: postgres

    - name: Wait for new leader to be elected
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ patroni_restapi_port }}/leader"
        return_content: false
      register: new_leader
      until: new_leader.status == 200
      retries: 20
      delay: 5
      run_once: true
      delegate_to: >-
        {{
          groups['patroni_cluster']
          | difference([inventory_hostname])
          | first
        }}

    - name: Print new cluster status
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ patroni_restapi_port }}/cluster"
        return_content: true
      register: new_status
      run_once: true
      delegate_to: "{{ groups['patroni_cluster'][0] }}"

    - name: Show new cluster status
      ansible.builtin.debug:
        msg: "{{ new_status.json | to_nice_json }}"
      run_once: true
