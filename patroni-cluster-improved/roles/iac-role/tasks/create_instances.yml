---
# =============================================================================
# roles/iac/tasks/create_instances.yml
# Pre-flight → zone check → discover → start existing → handle errors → create
# =============================================================================

# ── Pre-flight checks ─────────────────────────────────────────────────────────
- name: "[preflight] Check ADC credentials file exists"
  ansible.builtin.stat:
    path: "{{ adc_file }}"
  register: adc_stat

- name: "[preflight] Fail if ADC credentials file is missing"
  ansible.builtin.fail:
    msg: >
      GCP Application Default Credentials not found at {{ adc_file }}.
      Run: gcloud auth application-default login
  when: not adc_stat.stat.exists

- name: "[preflight] Check SSH public key exists"
  ansible.builtin.stat:
    path: "{{ ssh_pubkey_path }}"
  register: ssh_key_stat

- name: "[preflight] Fail if SSH public key is missing"
  ansible.builtin.fail:
    msg: "SSH public key not found at {{ ssh_pubkey_path }}."
  when: not ssh_key_stat.stat.exists

- name: "[preflight] Read SSH public key content"
  ansible.builtin.slurp:
    src: "{{ ssh_pubkey_path }}"
  register: ssh_pubkey_content

- name: "[preflight] Ensure inventory output directory exists"
  ansible.builtin.file:
    path: "{{ inventory_output_dir }}"
    state: directory
    mode: "0755"

# ── Fetch ALL GCP zones ───────────────────────────────────────────────────────
- name: "[preflight] Fetch ALL available zones from GCP"
  ansible.builtin.command:
    cmd: >
      gcloud compute zones list
      --project={{ google_project_id }}
      --format=json
  register: all_gcp_zones_raw
  changed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"

- name: "[preflight] Build list of all UP zones"
  ansible.builtin.set_fact:
    all_available_zones: "{{ all_gcp_zones_raw.stdout | from_json | selectattr('status', 'equalto', 'UP') | map(attribute='name') | list }}"

- name: "[preflight] Show total UP zones"
  ansible.builtin.debug:
    msg: "Total UP zones on GCP: {{ all_available_zones | length }}"

# ── STAGE 1: Discover existing instances (zone-agnostic) ──────────────────────
- name: "[discover] Find each instance by name across all zones"
  ansible.builtin.command:
    cmd: >
      gcloud compute instances list
      --project={{ google_project_id }}
      --filter="name={{ item.name }}"
      --format=json
  loop: "{{ machines_info }}"
  loop_control:
    label: "{{ item.name }}"
  register: instance_discover
  changed_when: false
  failed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"

- name: "[discover] Write discover results to temp file"
  ansible.builtin.copy:
    content: "{{ instance_discover.results | to_json }}"
    dest: /tmp/ansible_discover_results.json

- name: "[discover] Parse discover results into state lists"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/parse_discover.py"
    executable: "{{ gcp_venv_dir }}/bin/python3"
  register: discover_parsed
  changed_when: false

- name: "[discover] Load parsed state into facts"
  ansible.builtin.set_fact:
    running_instances: "{{ (discover_parsed.stdout | from_json).running_instances }}"
    stopped_instances: "{{ (discover_parsed.stdout | from_json).stopped_instances }}"
    new_instances:     "{{ (discover_parsed.stdout | from_json).new_instances }}"
    actual_zone_map:   "{{ (discover_parsed.stdout | from_json).actual_zone_map }}"

- name: "[discover] Show what was found"
  ansible.builtin.debug:
    msg:
      - "RUNNING/STAGING : {{ running_instances }}"
      - "STOPPED         : {{ stopped_instances }}"
      - "NOT EXISTS      : {{ new_instances }}"
      - "ACTUAL ZONES    : {{ actual_zone_map }}"

# ── STAGE 2: Try to start every STOPPED instance ──────────────────────────────
- name: "[start] Try to start each stopped instance"
  ansible.builtin.command:
    cmd: >
      gcloud compute instances start {{ item }}
      --zone={{ actual_zone_map[item] }}
      --project={{ google_project_id }}
      --format=json
  loop: "{{ stopped_instances }}"
  register: start_results
  changed_when: start_results.rc == 0
  failed_when: false
  when: stopped_instances | length > 0
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"

# ── STAGE 3: Classify every start failure ────────────────────────────────────
- name: "[classify] Write start results to temp file"
  ansible.builtin.copy:
    content: "{{ start_results.results | default([]) | to_json }}"
    dest: /tmp/ansible_start_results.json

- name: "[classify] Parse start results into failure buckets"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/classify_start.py"
    executable: "{{ gcp_venv_dir }}/bin/python3"
  register: classify_parsed
  changed_when: false

- name: "[classify] Load failure buckets into facts"
  ansible.builtin.set_fact:
    started_ok:         "{{ (classify_parsed.stdout | from_json).started_ok }}"
    relocate_failures:  "{{ (classify_parsed.stdout | from_json).relocate_failures }}"
    not_found_failures: "{{ (classify_parsed.stdout | from_json).not_found_failures }}"
    transient_failures: "{{ (classify_parsed.stdout | from_json).transient_failures }}"
    fatal_failures:     "{{ (classify_parsed.stdout | from_json).fatal_failures }}"

- name: "[classify] Show failure breakdown"
  ansible.builtin.debug:
    msg:
      - "Started OK       : {{ started_ok }}"
      - "Relocate needed  : {{ relocate_failures | map(attribute='name') | list }}"
      - "Not found        : {{ not_found_failures | map(attribute='name') | list }}"
      - "Transient errors : {{ transient_failures | map(attribute='name') | list }}"
      - "FATAL errors     : {{ fatal_failures | map(attribute='name') | list }}"

- name: "[classify] Fail immediately on fatal errors"
  ansible.builtin.fail:
    msg: "Fatal error starting {{ item.name }} — fix credentials before retrying."
  loop: "{{ fatal_failures }}"
  loop_control:
    label: "{{ item.name }}"
  when: fatal_failures | length > 0

- name: "[classify] Warn on transient errors (will not relocate)"
  ansible.builtin.debug:
    msg: "Transient error for {{ item.name }} — re-run to retry."
  loop: "{{ transient_failures }}"
  loop_control:
    label: "{{ item.name }}"
  when: transient_failures | length > 0

# ── STAGE 4: Delete + release IP for RELOCATE failures ───────────────────────
- name: "[recover] Delete instance that needs relocation"
  ansible.builtin.command:
    cmd: >
      gcloud compute instances delete {{ item.name }}
      --zone={{ actual_zone_map[item.name] }}
      --project={{ google_project_id }}
      --quiet
  loop: "{{ relocate_failures }}"
  loop_control:
    label: "{{ item.name }}"
  when: relocate_failures | length > 0
  failed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"

- name: "[recover] Release old static IP for relocated instance"
  google.cloud.gcp_compute_address:
    name: "{{ item.name }}-ip"
    region: "{{ actual_zone_map[item.name] | regex_replace('-[a-z]$', '') }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: absent
  loop: "{{ relocate_failures }}"
  loop_control:
    label: "{{ item.name }}"
  when: relocate_failures | length > 0
  failed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"
  vars:
    ansible_python_interpreter: "{{ gcp_venv_dir }}/bin/python3"

# ── STAGE 5: Release stale IP for NOT_FOUND failures ─────────────────────────
- name: "[recover] Release stale IP for not-found instance"
  google.cloud.gcp_compute_address:
    name: "{{ item.name }}-ip"
    region: "{{ (machines_info | selectattr('name', 'equalto', item.name) | first).zone | regex_replace('-[a-z]$', '') }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: absent
  loop: "{{ not_found_failures }}"
  loop_control:
    label: "{{ item.name }}"
  when: not_found_failures | length > 0
  failed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"
  vars:
    ansible_python_interpreter: "{{ gcp_venv_dir }}/bin/python3"

# ── STAGE 6: Build instances_to_recreate ─────────────────────────────────────
- name: "[recreate] Write inputs for recreate script"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
  loop:
    - { content: "{{ machines_info | to_json }}",       dest: /tmp/ansible_machines.json }
    - { content: "{{ relocate_failures | to_json }}",   dest: /tmp/ansible_relocate.json }
    - { content: "{{ not_found_failures | to_json }}",  dest: /tmp/ansible_notfound.json }
    - { content: "{{ all_available_zones | to_json }}", dest: /tmp/ansible_allzones.json }
    - { content: "{{ actual_zone_map | to_json }}",     dest: /tmp/ansible_zonemap.json }
  loop_control:
    label: "{{ item.dest }}"

- name: "[recreate] Build instances_to_recreate list"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/build_recreate_list.py"
    executable: "{{ gcp_venv_dir }}/bin/python3"
  register: recreate_list_raw
  changed_when: false

- name: "[recreate] Load instances_to_recreate into fact"
  ansible.builtin.set_fact:
    instances_to_recreate: "{{ recreate_list_raw.stdout | from_json }}"

- name: "[recreate] Show instances queued for recreation"
  ansible.builtin.debug:
    msg: "{{ item.name }} → {{ item.zone }} (reason: {{ item._reason }})"
  loop: "{{ instances_to_recreate }}"
  when: instances_to_recreate | length > 0

- name: "[recreate] Build full list of instances needing IP + creation"
  ansible.builtin.set_fact:
    instances_needing_creation: "{{ instances_to_recreate + (machines_info | selectattr('name', 'in', new_instances) | list) }}"

- name: "[recreate] Show full creation list"
  ansible.builtin.debug:
    msg: "{{ item.name }} → {{ item.zone }}"
  loop: "{{ instances_needing_creation }}"
  when: instances_needing_creation | length > 0

# ── Reserve Static IPs ────────────────────────────────────────────────────────
- name: "[create] Reserve static external IP for each instance needing creation"
  google.cloud.gcp_compute_address:
    name: "{{ item.name }}-ip"
    region: "{{ item.zone | regex_replace('-[a-z]$', '') }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: present
  loop: "{{ instances_needing_creation }}"
  loop_control:
    label: "{{ item.name }}"
  when: instances_needing_creation | length > 0
  register: gcp_addresses
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"
  vars:
    ansible_python_interpreter: "{{ gcp_venv_dir }}/bin/python3"

# ── Create Instances ──────────────────────────────────────────────────────────
- name: "[create] Provision instances"
  google.cloud.gcp_compute_instance:
    name: "{{ item.item.name }}"
    machine_type: "{{ item.item.machine_type }}"
    zone: "{{ item.item.zone }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: present
    metadata:
      ssh-keys: "{{ agent_user }}:{{ ssh_pubkey_content.content | b64decode | trim }}"
    disks:
      - auto_delete: true
        boot: true
        initialize_params:
          source_image: "{{ item.item.image }}"
          disk_size_gb: "{{ item.item.disk_size }}"
          disk_type: "{{ item.item.disk_type }}"
    network_interfaces:
      - network:
          selfLink: "projects/{{ google_project_id }}/global/networks/default"
        access_configs:
          - name: External NAT
            type: ONE_TO_ONE_NAT
            nat_ip:
              address: "{{ item.address }}"
    tags:
      items: "{{ instance_network_tags }}"
  loop: "{{ gcp_addresses.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }} ({{ item.item.zone }})"
  when: instances_needing_creation | length > 0
  register: gcp_instances
  ignore_errors: true
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"
  vars:
    ansible_python_interpreter: "{{ gcp_venv_dir }}/bin/python3"

# ── STAGE 7: Safety net — catch EXHAUSTED/QUOTA on creation ──────────────────
- name: "[create] Write creation results to temp file"
  ansible.builtin.copy:
    content: "{{ gcp_instances.results | default([]) | to_json }}"
    dest: /tmp/ansible_create_results.json

- name: "[create] Parse creation failures"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/parse_create_failures.py"
    executable: "{{ gcp_venv_dir }}/bin/python3"
  register: create_failures_parsed
  changed_when: false

- name: "[create] Load creation failure facts"
  ansible.builtin.set_fact:
    create_exhausted: "{{ (create_failures_parsed.stdout | from_json).exhausted }}"
    create_fatal:     "{{ (create_failures_parsed.stdout | from_json).fatal }}"

- name: "[create] Fail immediately on fatal creation errors"
  ansible.builtin.fail:
    msg: "Fatal error creating {{ item.name }}: {{ item.msg }}"
  loop: "{{ create_fatal }}"
  loop_control:
    label: "{{ item.name }}"
  when: create_fatal | length > 0

- name: "[create] Show exhausted instances needing retry"
  ansible.builtin.debug:
    msg: "{{ item.name }} exhausted in {{ item.old_zone }} — retrying in {{ item.new_zone }}"
  loop: "{{ create_exhausted }}"
  when: create_exhausted | length > 0

- name: "[create] Release IP in exhausted zone"
  google.cloud.gcp_compute_address:
    name: "{{ item.name }}-ip"
    region: "{{ item.old_zone | regex_replace('-[a-z]$', '') }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: absent
  loop: "{{ create_exhausted }}"
  loop_control:
    label: "{{ item.name }}"
  when: create_exhausted | length > 0
  failed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"
  vars:
    ansible_python_interpreter: "{{ gcp_venv_dir }}/bin/python3"

- name: "[create] Reserve fallback IP in different region"
  google.cloud.gcp_compute_address:
    name: "{{ item.name }}-ip"
    region: "{{ item.new_zone | regex_replace('-[a-z]$', '') }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: present
  loop: "{{ create_exhausted }}"
  loop_control:
    label: "{{ item.name }}"
  when: create_exhausted | length > 0
  register: fallback_addresses
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"
  vars:
    ansible_python_interpreter: "{{ gcp_venv_dir }}/bin/python3"

- name: "[create] Retry exhausted instances in different region"
  google.cloud.gcp_compute_instance:
    name: "{{ item.item.name }}"
    machine_type: "{{ (machines_info | selectattr('name', 'equalto', item.item.name) | first).machine_type }}"
    zone: "{{ item.item.new_zone }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: present
    metadata:
      ssh-keys: "{{ agent_user }}:{{ ssh_pubkey_content.content | b64decode | trim }}"
    disks:
      - auto_delete: true
        boot: true
        initialize_params:
          source_image: "{{ (machines_info | selectattr('name', 'equalto', item.item.name) | first).image }}"
          disk_size_gb: "{{ (machines_info | selectattr('name', 'equalto', item.item.name) | first).disk_size }}"
          disk_type: "{{ (machines_info | selectattr('name', 'equalto', item.item.name) | first).disk_type }}"
    network_interfaces:
      - network:
          selfLink: "projects/{{ google_project_id }}/global/networks/default"
        access_configs:
          - name: External NAT
            type: ONE_TO_ONE_NAT
            nat_ip:
              address: "{{ item.address }}"
    tags:
      items: "{{ instance_network_tags }}"
  loop: "{{ fallback_addresses.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }} → {{ item.item.new_zone }}"
  when: create_exhausted | length > 0
  register: gcp_retry_instances
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"
  vars:
    ansible_python_interpreter: "{{ gcp_venv_dir }}/bin/python3"

# ── Fetch details for already-running/started instances ───────────────────────
- name: "[merge] Fetch full details for already-running/started instances"
  ansible.builtin.command:
    cmd: >
      gcloud compute instances describe {{ item }}
      --zone={{ actual_zone_map[item] }}
      --project={{ google_project_id }}
      --format=json
  loop: "{{ running_instances + started_ok }}"
  register: existing_instance_details
  changed_when: false
  failed_when: false
  when: (running_instances + started_ok) | length > 0
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"

# ── Write all raw results to temp files for merge script ─────────────────────
- name: "[merge] Write existing instance details to temp file"
  ansible.builtin.copy:
    content: "{{ existing_instance_details.results | default([]) | to_json }}"
    dest: /tmp/ansible_existing_details.json

- name: "[merge] Write new instance results to temp file"
  ansible.builtin.copy:
    content: "{{ gcp_instances.results | default([]) | to_json }}"
    dest: /tmp/ansible_new_instance_results.json

- name: "[merge] Write retry instance results to temp file"
  ansible.builtin.copy:
    content: "{{ gcp_retry_instances.results | default([]) | to_json }}"
    dest: /tmp/ansible_retry_instance_results.json

# ── Merge all results ─────────────────────────────────────────────────────────
- name: "[merge] Combine all instances into a single list"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/merge_instances.py"
    executable: "{{ gcp_venv_dir }}/bin/python3"
  register: merge_result
  changed_when: false

- name: "[merge] Load all_instances from merge result"
  ansible.builtin.set_fact:
    all_instances: "{{ merge_result.stdout | from_json }}"

- name: "[merge] Show instance count"
  ansible.builtin.debug:
    msg: "Total instances in all_instances: {{ all_instances | length }}"

# ── Wait for SSH ──────────────────────────────────────────────────────────────
- name: "[wait] Wait for SSH on all instances"
  ansible.builtin.wait_for:
    host: "{{ item.networkInterfaces[0].accessConfigs[0].natIP }}"
    port: 22
    timeout: "{{ instance_ssh_timeout }}"
    state: started
  loop: "{{ all_instances }}"
  loop_control:
    label: "{{ item.name }}"

# ── Collect IPs ───────────────────────────────────────────────────────────────
- name: "[info] Collect instance IPs into a fact"
  ansible.builtin.set_fact:
    instance_ip_map: >-
      {{
        instance_ip_map | default({}) | combine({
          item.name: {
            'external_ip': item.networkInterfaces[0].accessConfigs[0].natIP,
            'internal_ip': item.networkInterfaces[0].networkIP,
            'zone':        item.zone.split('/')[-1],
            'role':        (machines_info | selectattr('name', 'equalto', item.name) | first).role
                           | default('master')
          }
        })
      }}
  loop: "{{ all_instances }}"
  loop_control:
    label: "{{ item.name }}"

- name: "[info] Print instance IP map"
  ansible.builtin.debug:
    var: instance_ip_map

# ── Generate inventory files ──────────────────────────────────────────────────
- name: "[inventory] Generate Ansible inventory (hosts.ini)"
  ansible.builtin.template:
    src: masters-inventory.j2
    dest: "{{ masters_inventory_file }}"
    mode: "0644"
  vars:
    gcp_instances:
      results: "{{ all_instances }}"

- name: "[inventory] Generate external inventory (inventory.ini)"
  ansible.builtin.template:
    src: external-inventory.j2
    dest: "{{ external_inventory_file }}"
    mode: "0644"
  vars:
    gcp_instances:
      results: "{{ all_instances }}"

- name: "[inventory] Write all_instances to JSON file"
  ansible.builtin.copy:
    content: "{{ all_instances | to_nice_json }}"
    dest: "{{ inventory_output_dir }}/gcp_instances.json"
    mode: "0644"

- name: "[inventory] Print generated inventory path"
  ansible.builtin.debug:
    msg:
      - "Inventory      → {{ masters_inventory_file }}"
      - "Instances JSON → {{ inventory_output_dir }}/gcp_instances.json"

# ── Add hosts to in-memory inventory ─────────────────────────────────────────
- name: "[inventory] Add master (pg-node) hosts to in-memory inventory"
  ansible.builtin.add_host:
    name: "{{ item.name }}"
    ansible_host: "{{ instance_ip_map[item.name].external_ip }}"
    ansible_user: "{{ agent_user }}"
    ansible_ssh_private_key_file: "{{ ssh_pubkey_path | replace('.pub', '') }}"
    groups: [masters, all_nodes]
  loop: "{{ machines_info | selectattr('role', 'equalto', 'master') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: "[inventory] Add haproxy hosts to in-memory inventory"
  ansible.builtin.add_host:
    name: "{{ item.name }}"
    ansible_host: "{{ instance_ip_map[item.name].external_ip }}"
    ansible_user: "{{ agent_user }}"
    ansible_ssh_private_key_file: "{{ ssh_pubkey_path | replace('.pub', '') }}"
    groups: [haproxy, all_nodes]
  loop: "{{ machines_info | selectattr('role', 'equalto', 'haproxy') | list }}"
  loop_control:
    label: "{{ item.name }}"

# ── Sync actual running zones back into defaults/main.yml ─────────────────────
- name: "[sync] Collect final running instance zones from GCP"
  ansible.builtin.command:
    cmd: >
      gcloud compute instances list
      --project={{ google_project_id }}
      --filter="name={{ item.name }}"
      --format=json
  loop: "{{ machines_info }}"
  loop_control:
    label: "{{ item.name }}"
  register: final_instance_info
  changed_when: false
  failed_when: false
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    CLOUDSDK_CONFIG: "{{ agent_home }}/.config/gcloud"

- name: "[sync] Write final instance info to temp file"
  ansible.builtin.copy:
    content: "{{ final_instance_info.results | to_json }}"
    dest: /tmp/ansible_final_instances.json

- name: "[sync] Build final name to zone map"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/parse_final_zones.py"
    executable: "{{ gcp_venv_dir }}/bin/python3"
  register: final_zone_map_raw
  changed_when: false

- name: "[sync] Load final zone map into fact"
  ansible.builtin.set_fact:
    final_zone_map: "{{ final_zone_map_raw.stdout | from_json }}"

- name: "[sync] Show final running zones"
  ansible.builtin.debug:
    msg: "{{ item.key }} → {{ item.value }}"
  loop: "{{ final_zone_map | dict2items }}"

- name: "[sync] Patch zones back into defaults/main.yml"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/sync_vars.py {{ vars_file_path }}"
    executable: "{{ gcp_venv_dir }}/bin/python3"
  changed_when: true
  run_once: true

# ── Cleanup temp files ────────────────────────────────────────────────────────
- name: "[cleanup] Remove temp JSON files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/ansible_discover_results.json
    - /tmp/ansible_start_results.json
    - /tmp/ansible_machines.json
    - /tmp/ansible_relocate.json
    - /tmp/ansible_notfound.json
    - /tmp/ansible_allzones.json
    - /tmp/ansible_zonemap.json
    - /tmp/ansible_create_results.json
    - /tmp/ansible_new_relocate.json
    - /tmp/ansible_final_instances.json
    - /tmp/ansible_existing_details.json
    - /tmp/ansible_new_instance_results.json
    - /tmp/ansible_retry_instance_results.json
  failed_when: false

- name: "[sync] Refresh inventory"
  ansible.builtin.meta: refresh_inventory
