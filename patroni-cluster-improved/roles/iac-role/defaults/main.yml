---
# =============================================================================
# roles/iac-role/defaults/main.yml
#
# DYNAMIC NODE SCALING
# ════════════════════


# ── Identity ──────────────────────────────────────────────────────────────────
agent_user: "{{ lookup('env', 'USER') }}"
agent_home: "{{ lookup('env', 'HOME') }}"
project_root: "{{ playbook_dir }}"

# ── GCP auth & project ────────────────────────────────────────────────────────
# Recommended: move to vault.yml
# google_project_id: "{{ vault_google_project_id }}"
google_project_id: "database-cluster-31916"
adc_file: "{{ agent_home }}/.config/gcloud/application_default_credentials.json"

# ── SSH ───────────────────────────────────────────────────────────────────────
ssh_pubkey_path: "{{ agent_home }}/.ssh/id_rsa.pub"

# ── Python venv ───────────────────────────────────────────────────────────────
# Single project venv — install with: pip install -r requirements.txt
gcp_venv_dir: "{{ project_root }}/.venv"

gcp_pip_packages:
  - requests
  - google-auth
  - apache-libcloud

# ── Instance creation settings ────────────────────────────────────────────────
instance_network_tags:
  - http-server
  - https-server

instance_create_retries: 3
instance_create_delay: 10
instance_ssh_timeout: 300

# ── Inventory output paths ────────────────────────────────────────────────────
inventory_output_dir: "{{ project_root }}/inventory"
masters_inventory_file: "{{ inventory_output_dir }}/hosts.ini"
external_inventory_file: "{{ inventory_output_dir }}/inventory.ini" 

# Path to this file — used by [sync] task to patch zones after creation
vars_file_path: "{{ project_root }}/roles/iac-role/defaults/main.yml"

# =============================================================================
# ✏️  EDIT THESE — change counts to scale up/down
# =============================================================================
pg_node_count:      3
haproxy_node_count: 3

# =============================================================================
# Node spec templates — applied to ALL nodes of each type
# =============================================================================
pg_node_spec:
  machine_type: "e2-standard-2"
  disk_size: 50
  disk_type: "pd-standard"
  image_key: "v22"

haproxy_node_spec:
  machine_type: "e2-small"
  disk_size: 20
  disk_type: "pd-standard"
  image_key: "v22"

# =============================================================================
# Zone pools — nodes distributed round-robin across these zones
# =============================================================================
pg_node_zones:
  - "us-east4-c"
  - "europe-west4-a"
  - "europe-west2-c"

haproxy_node_zones:
  - "europe-west2-c"

# ── Ubuntu image aliases ──────────────────────────────────────────────────────
ubuntu_specs:
  v22:
    image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts"
  v24:
    image: "projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts"

# =============================================================================
# machines_info — dynamically generated from counts + specs above
#
# pg-node1..N   → role: master  (PostgreSQL + Patroni + etcd)
# ha-proxy1..N  → role: haproxy (HAProxy + Keepalived)
#
# Zones assigned round-robin:
#   pg-node1 → pg_node_zones[0]
#   pg-node2 → pg_node_zones[1]
#   pg-node3 → pg_node_zones[2]
#   pg-node4 → pg_node_zones[0]  ← wraps around
# =============================================================================
machines_info: >-
  {%- set nodes = [] -%}

  {%- for i in range(1, pg_node_count + 1) -%}
    {%- set zone = pg_node_zones[(i - 1) % pg_node_zones | length] -%}
    {%- set _ = nodes.append({
      'name':         'pg-node' ~ i,
      'role':         'master',
      'machine_type': pg_node_spec.machine_type,
      'image':        ubuntu_specs[pg_node_spec.image_key].image,
      'zone':         zone,
      'disk_size':    pg_node_spec.disk_size,
      'disk_type':    pg_node_spec.disk_type
    }) -%}
  {%- endfor -%}

  {%- for i in range(1, haproxy_node_count + 1) -%}
    {%- set zone = haproxy_node_zones[(i - 1) % haproxy_node_zones | length] -%}
    {%- set _ = nodes.append({
      'name':         'ha-proxy' ~ i,
      'role':         'haproxy',
      'machine_type': haproxy_node_spec.machine_type,
      'image':        ubuntu_specs[haproxy_node_spec.image_key].image,
      'zone':         zone,
      'disk_size':    haproxy_node_spec.disk_size,
      'disk_type':    haproxy_node_spec.disk_type
    }) -%}
  {%- endfor -%}

  {{ nodes }}