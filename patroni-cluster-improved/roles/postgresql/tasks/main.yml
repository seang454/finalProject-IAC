---
# =============================================================================
# Role: postgresql  –  Install PostgreSQL (Patroni will manage the service)
# =============================================================================

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - wget
      - gnupg2
      - lsb-release
      - acl           # needed for become_user tasks
    state: present
    update_cache: true

- name: Add PostgreSQL GPG key
  ansible.builtin.shell: |
    wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc \
      | gpg --dearmor -o /usr/share/keyrings/postgresql-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/postgresql-archive-keyring.gpg

- name: Add PostgreSQL apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg]
      http://apt.postgresql.org/pub/repos/apt
      {{ ansible_distribution_release }}-pgdg main
    filename: pgdg
    state: present

- name: Install PostgreSQL {{ postgresql_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
    state: present
    update_cache: true

- name: Stop and disable the default PostgreSQL service (Patroni will own it)
  ansible.builtin.systemd:
    name: postgresql
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove the default PostgreSQL data directory
  ansible.builtin.file:
    path: "/var/lib/postgresql/{{ postgresql_version }}/main"
    state: absent

- name: Create PostgreSQL log directory
  ansible.builtin.file:
    path: "{{ postgresql_log_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"
