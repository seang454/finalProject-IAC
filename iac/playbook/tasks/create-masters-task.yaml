# tasks for only create the master instance 
- name: Loop to show machines specs
  debug: 
    msg: |
      Machine Name: {{ item.name }}
  loop: "{{ machines_info }}"
  when: true 

- name: Check if public key exist 
  stat:
    path: "{{ ssh_pubkey_path }}"
  register: ssh_pubkey_stat

- name: Generate ssh key pair there is no pub key 
  shell: |
    ssh-keygen -t rsa -b 4096 -f /home/{{agent_user}}/.ssh/id_rsa -N ''
  become_user: "{{agent_user}}"  
  when: ssh_pubkey_stat.stat.exists == False

- name: Slurp pub key from local machine 
  slurp: 
    src: "{{ ssh_pubkey_path }}"
  register: ssh_pubkey

- name: Reserve static external IP for each machine
  google.cloud.gcp_compute_address:
    name: "{{ item.name }}-ip"
    region: "{{ item.zone | regex_replace('-[a-z]$', '') }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: present
  loop: "{{ machines_info }}"
  register: gcp_addresses
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
  vars:
    ansible_python_interpreter: /opt/gcp-venv/bin/python3

- name: Create GCP instance
  google.cloud.gcp_compute_instance:
    name: "{{ item.item.name }}"           # item.item = original machine spec from machines_info
    machine_type: "{{ item.item.machine_type }}"
    zone: "{{ item.item.zone }}"
    project: "{{ google_project_id }}"
    auth_kind: application
    state: present
    metadata:
      ssh-keys: "{{ agent_user }}:{{ ssh_pubkey['content'] | b64decode }}"
    disks:
      - auto_delete: true
        boot: true
        initialize_params:
          source_image: "{{ item.item.image }}"
          disk_size_gb: "{{ item.item.disk_size }}"
          disk_type: "{{ item.item.disk_type }}"
    network_interfaces:
      - network:
          selfLink: "projects/{{ google_project_id }}/global/networks/default"
        access_configs:
          - name: External NAT
            type: ONE_TO_ONE_NAT
            nat_ip:
              address: "{{ item.address }}"  # bind reserved static IP
    tags:
      items:
        - http-server
        - https-server
  loop: "{{ gcp_addresses.results }}"      # loop over reserved IPs instead of machines_info
  register: gcp_instances
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ adc_file }}"
    GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES: "1"
  vars:
    ansible_python_interpreter: /opt/gcp-venv/bin/python3
- name: Write gcp_instances into json file
  copy:
    content: "{{ gcp_instances }}"
    dest: "./gcp_more_instances.json"
  run_once: true
  when: true

- name: Create inventory from template 
  template: 
    src: ../templates/masters-inventory.j2
    dest: ../inventory.ini
  run_once: true
  when: true
- name: Refresh inventory to pick up new hosts
  meta: refresh_inventory