---
# =============================================================================
# roles/keepalived/tasks/main.yml
# Install and configure Keepalived on HAProxy nodes
# =============================================================================

- name: "[keepalived] Install keepalived"
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true

- name: "[keepalived] Enable IP non-local bind (required for VIP)"
  ansible.builtin.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-keepalived.conf

- name: "[keepalived] Deploy keepalived configuration"
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart keepalived

- name: "[keepalived] Deploy HAProxy health check script"
  ansible.builtin.template:
    src: check_haproxy.sh.j2
    dest: /etc/keepalived/check_haproxy.sh
    owner: root
    group: root
    mode: "0755"

- name: "[keepalived] Enable and start keepalived"
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    state: started
    daemon_reload: true

- name: "[keepalived] Verify keepalived is running"
  ansible.builtin.command:
    cmd: systemctl is-active keepalived
  register: keepalived_status
  changed_when: false

- name: "[keepalived] Show keepalived status"
  ansible.builtin.debug:
    msg: "keepalived on {{ inventory_hostname }}: {{ keepalived_status.stdout }}"
